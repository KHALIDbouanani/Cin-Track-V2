<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>CinTrack - Admin</title>
</head>
<body class="bg-gray-950 text-white">
    <header class="bg-gray-800 text-white p-4 flex flex-wrap gap-2 justify-between items-center">
        <h1 class="text-2xl font-bold">CinTrack · Admin</h1>
        <div class="flex gap-2">
            <button id="btn-add" class="bg-green-500 hover:bg-green-600 over hover:scale-105 px-4 py-2 rounded-lg font-semibold cursor-pointer">
                + Ajouter un titre
            </button>
            <a href="index.html" class="bg-red-500 hover:bg-red-600 hover:-translate-x-1 px-4 py-2 rounded-lg font-semibold">
                ← Retour au catalogue
            </a>
        </div>
    </header>

    <main class="p-4">
        <div id="admin-status" class="my-4"></div>

        <div class="overflow-x-auto">
            <table id="affichage_tab" class="border-2 border-black w-full bg-gray-950">
                <thead>
                    <tr>
                        <th class="border-2 border-black p-4">Image</th>
                        <th class="border-2 border-black p-4">Titre</th>
                        <th class="border-2 border-black p-4">Type</th>
                        <th class="border-2 border-black p-4">Année</th>
                        <th class="border-2 border-black p-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="affichage_body"></tbody>
            </table>
        </div>
    </main>

    <footer class="p-4 text-center text-gray-500">Ichharat hhh</footer>

    <div id="form-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-gray-950 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[92vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 id="form-title" class="text-xl font-bold">Ajouter un titre</h2>
                <button id="form-close" type="button" class="text-gray-500 hover:text-white text-3xl cursor-pointer">&times;</button>
            </div>

            <form id="content-form" class="p-4 space-y-4 text-black">

                <div>
                    <label for="f-title" class="block text-white font-semibold mb-1">Titre *</label>
                    <input id="f-title" type="text" class="w-full border rounded-lg p-2">
                    <p id="error-title" class="error text-red-600 text-sm mt-1 hidden"></p>
                </div>

                <div>
                    <label for="f-image" class="block text-white font-semibold mb-1">URL de l'image *</label>
                    <input id="f-image" type="text" placeholder="https://..." class="w-full border rounded-lg p-2 placeholder-gray-700">
                    <p id="error-image" class="error text-red-600 text-sm mt-1 hidden"></p>
                </div>

                <div>
                    <label for="f-type" class="block text-white font-semibold mb-1">Type *</label>
                    <select id="f-type" class="w-full border rounded-lg p-2">
                        <option value="">— Choisir —</option>
                        <option value="movie">Film</option>
                        <option value="series">Série</option>
                    </select>
                    <p id="error-type" class="error text-red-600 text-sm mt-1 hidden"></p>
                </div>

                <div>
                    <label for="f-releaseYear" class="block text-white font-semibold mb-1">Année de sortie *</label>
                    <input id="f-releaseYear" type="number" class="w-full border rounded-lg p-2">
                    <p id="error-releaseYear" class="error text-red-600 text-sm mt-1 hidden"></p>
                </div>

                <div id="field-duration" class="hidden">
                    <label for="f-duration" class="block text-white font-semibold mb-1">Durée (minutes) *</label>
                    <input id="f-duration" type="number" class="w-full border rounded-lg p-2">
                    <p id="error-duration" class="error text-red-600 text-sm mt-1 hidden"></p>
                </div>

                <div id="field-seasons" class="hidden">
                    <label for="f-seasons" class="block text-white font-semibold mb-1">Nombre de saisons *</label>
                    <input id="f-seasons" type="number" class="w-full border rounded-lg p-2">
                    <p id="error-seasons" class="error text-red-600 text-sm mt-1 hidden"></p>
                </div>

                <div>
                    <label for="f-genres" class="block text-white font-semibold mb-1">Genres * (séparés par des virgules)</label>
                    <input id="f-genres" type="text" placeholder="Drame, Crime, Thriller" class="w-full border rounded-lg p-2 placeholder-gray-700">
                    <p id="error-genres" class="error text-red-600 text-sm mt-1 hidden"></p>
                </div>

                <div>
                    <label for="f-directors" class="block text-white font-semibold mb-1">Réalisateurs * (séparés par des virgules)</label>
                    <input id="f-directors" type="text" class="w-full border rounded-lg p-2">
                    <p id="error-directors" class="error text-red-600 text-sm mt-1 hidden"></p>
                </div>

                <div>
                    <label for="f-countries" class="block text-white font-semibold mb-1">Pays de production * (séparés par des virgules)</label>
                    <input id="f-countries" type="text" class="w-full border rounded-lg p-2">
                    <p id="error-productionCountries" class="error text-red-600 text-sm mt-1 hidden"></p>
                </div>

                <div>
                    <label for="f-description" class="block text-white font-semibold mb-1">Description *</label>
                    <textarea id="f-description" rows="4" class="w-full border rounded-lg p-2"></textarea>
                    <p id="error-description" class="error text-red-600 text-sm mt-1 hidden"></p>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" id="form-cancel" class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 font-semibold cursor-pointer">
                        Annuler
                    </button>
                    <button type="submit" id="form-submit" class="px-4 py-2 rounded-lg bg-green-500 hover:bg-green-600 text-white font-semibold cursor-pointer">
                        Ajouter
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
